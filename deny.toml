# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# GAP-SSH-DEP-002 (0.3.8): russh 0.62.x + stack crypto estável; sem waiver de CVE/yanked.
#
# A1 (auditoria 2026-08-07): russh estava travado em 0.62.2 enquanto CVE-2026-68930
# (GHSA-m65r-rprj-r5rg, publicado 2026-08-03) atinge `<= 0.62.4`. O bug é do lado
# SERVIDOR — callbacks de canal despachados para IDs nunca abertos — e esta CLI é
# cliente puro, sem uma única referência a `russh::server`. Ainda assim o pin subiu
# para 0.62.5: manter transporte SSH vulnerável é postura indefensável em auditoria,
# e este gate deu VERDE sobre ele com o advisory-db sincronizado no mesmo dia.
# Lição: `cargo deny check advisories` verde não prova ausência de CVE conhecido.
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    # webpki-roots (Mozilla CA bundle) — CDLA Permissive 2.0
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# G-TLS-02: product crypto is aws-lc-rs only (SSH via russh + TLS via rustls).
# Ban OpenSSL/native-tls stacks and dual crypto provider `ring`.
# rustls is allowed (≥ 0.23.18, feature aws_lc_rs only) under feature `tls`.
#
# NOT a violation of the "no OpenSSL" rule: `openssl-probe` appears in the tree via
# rustls-native-certs. Despite the name it links nothing — it is pure Rust that looks
# up the platform CA bundle path on disk. Recorded here so the next audit does not
# reopen the false positive.
#
# A3 (auditoria 2026-08-07): this was `warn`, and the warning was load-bearing —
# `chacha20poly1305` 0.10 dragged in `aead` 0.5 / `chacha20` 0.9 / `poly1305` 0.8
# while russh and aws-lc-rs resolved the 0.6 / 0.10 / 0.9 generation. The result was
# TWO independent ChaCha20-Poly1305 implementations compiled into a security binary,
# and the gate stayed green for months. Bumping to `chacha20poly1305` 0.11,
# `getrandom` 0.3 and `toml` 1 collapsed 41 duplicate lines to 17.
# `deny` from now on: what remains is enumerated below, and anything NEW fails.
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { name = "openssl-sys" },
    { name = "openssl" },
    { name = "libssh2-sys" },
    { name = "native-tls" },
    { name = "ring" },
    { name = "ssh2" },
    { name = "thrussh" },
    { name = "libssh-rs" },
]

# Residual duplicates. Every entry is transitive and unreachable from our manifest:
# unifying them means waiting for the upstream crate to move, not editing this repo.
# They are listed one by one instead of silenced wholesale so a NEW duplicate — the
# kind we can actually fix — turns the gate red.

# russh 0.62 still uses the pre-1.0 `generic-array` internally.
skip = [
    # crypto-bigint / elliptic-curve resolve the newest RNG shim; aws-lc-rs the older.
    { crate = "getrandom@0.4.3", reason = "transitive: crypto-bigint via elliptic-curve" },
    { crate = "hashbrown@0.14.5", reason = "transitive: older indexmap consumers" },
    # ml-kem (post-quantum KEX in russh) pins the previous sha3 line.
    { crate = "sha3@0.11.0", reason = "transitive: ml-kem 0.3 via russh" },
    { crate = "syn@2.0.119", reason = "transitive: proc-macro deps not yet on syn 3" },
    { crate = "untrusted@0.7.1", reason = "transitive: aws-lc-rs 1.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
